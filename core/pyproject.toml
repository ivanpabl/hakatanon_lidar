[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-od"
version = "0.1.0"
description = "Обнаружение препятствий в тоннеле метро по облаку 3D-лидара (ядро, без ROS 2)"
requires-python = ">=3.10"   # Ubuntu 22.04 / ROS 2 Humble
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
tools = ["matplotlib", "rosbags"]   # офлайн-инструменты: чтение bag-файлов, графики

[tool.setuptools.packages.find]
include = ["tunnel_od*"]

[tool.setuptools.package-data]
"tunnel_od.sim" = ["ring_table.json"]
