name: GitHub Pages

# Кладёт готовый отчёт report/ (index.html + 3D-плеер demo.html) в ветку gh-pages.
# Один раз включить вручную: Settings → Pages → Source «Deploy from a branch» → gh-pages / (root).

on:
  push:
    branches: [main]
    paths: ['report/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: report/ → ветка gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Публикация
        run: |
          mkdir site && cp report/index.html report/demo.html site/ && touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Страница проекта: report/ из ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
