name: CI

on:
  push:
    branches: [main, cleanup]
  pull_request:
    branches: [main, cleanup]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрый контур без ROS 2: ядро tunnel_od + инструменты evaluation/ (tests/).
  # test_preproc.py сам собирает libtunnel_od_canonical (нужен g++/cmake, есть на ubuntu-latest).
  pytest:
    name: pytest (ядро, без ROS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.23,<2" pytest
          python -m pip install -e "./core[eval]"
      - name: pytest tests/
        run: python -m pytest -q -p no:cacheprovider tests

  # Полный контур в Docker (ROS 2 Humble): gtest tunnel_od_preproc + pytest пакетов ros2_ws.
  # Тот же образ и та же команда, что и `docker compose run --rm test`.
  docker-test:
    name: gtest + pytest в Docker (ROS 2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа tunnel-od (кэш слоёв в GitHub Actions)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: detector
          build-args: |
            BASE_IMAGE=docker.io/ros:humble-ros-base-jammy
          tags: tunnel-od:latest
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: docker compose run test
        run: docker compose run --rm --no-deps test
