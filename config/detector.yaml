tunnel_od_detector:
  ros__parameters:
    topic: ""
    refit_mode: async
    refit_every: 1
    alarm_range_fits: 3
    qos_reliability: reliable
    qos_depth: 5
    max_pending: 2
    catch_up: auto
    watchdog_timeout_s: 0.5
    watchdog_grace_s: 2.0
    warmup_frames: 3
    parse_backend: auto
    publish_markers: true
    marker_max_objects: 30
    markers_every: 1
    log_alarms: true
    skip_repeated: true
    stats_period_s: 5.0
    result_file: ""
    stats_file: ""
    detector_json: ""

    detector:
      method: zone
      near_cutoff: 2.0
      max_range: 250.0
      half_width: 1.0
      clearance: 0.15
      height: 3.0  # габарит ТЗ 2.1x3 м
      far_axis: true
      path_margin: 0.0
      far_from: 20.0
      far_half_width: 0.7
      far_top: 1.5  # высота 3.0 по ТЗ ближе far_from; дальше 1.5 -- f3.0 давал 20 ложных СТОП/1510 против 4, см. output/runs/fake_obj_fo_h3f15.txt
      edge_lines: true
      tracker: evidence
      evidence_threshold: 2.2
      evidence_decay: 0.8
      alarm_hold: 3
      alarm_hold_min: 5
      path_hold: 0
      ego_check: true
      ego_min_travel: 4.0
      ego_max_slope: -0.35
      confirm_hits: 3
      confirm_window: 5
      plausibility: true
      plausible_min_dist: 60.0
      plausible_behind_n: 2
      max_path_age: 30
      default_rail_offset: 0.5
      min_points_k: 12000.0
      min_points_floor: 3
      persist_hits: 6  # подтверждение по устойчивому неподвижному треку (объект 10: 5/7→6/7, ложные 4→5/1510, пустые 1,6→2,0 %); scratchpad exp3 V3
      persist_slope: [-1.25, -0.75]
      persist_edge_margin: 0.25
      min_sight_m: 30.0  # путь виден ближе 30 м (ось оборвалась у лидара) -- unknown, не clear; ~тормозной путь с 25 км/ч; scratchpad exp6 a
      sensor_axis_union_m: 40.0  # организаторы ставят объекты от оси лидара, рельсы повёрнуты на −0,27°; 7/8→8/8, объект 4 СТОП с 33 м, ложные 5/1510, пустые 2,01 %; scratchpad/exp7 V1
      sensor_axis_max_dev: 0.25
      # Правила против ложных СТОП (эксперимент exp/fp-range, разбор _exp_handoff/materials/fp_autopsy). По умолчанию ВЫКЛ:
      # persist_min_top_m: 0.5       # R1: persist не подтверждает объект с верхом < 0,5 м (0 -- выкл)
      # persist_min_top_lat_m: 0.55  # R1: только для объектов с |lateral_m| >= 0,55 м (у головки рельса); null -- для всех
      # front_lift_caution_m: 0.1    # R2: front_maxh >= low_m + 0,1 и low_m < front_lift_max_low_m -> caution/front_lift (null -- выкл)
      # front_lift_max_low_m: 2.0    # R2: ограничение по низу объекта
      # stop_confirm_far_m: 30.0     # R3: СТОП на d >= 30 м только если был СТОП и в прошлом кадре, иначе caution/far_unconfirmed (null -- выкл)

tunnel_od_preproc:
  ros__parameters:
    input_topic: ""
    input_format: auto
    input_axes: auto
    dedupe_dual_return: true
    dedupe_rounded: true  # дубли по сетке 1 см (облако не из пар столбцов Hesai) снимает C++, а не узел (−25..35 мс/кадр)
    crop_enabled: true
    crop_fwd_min: 2.0
    crop_fwd_max: 250.0
    apply_mount_tf: false
    base_frame: base_link
    speed_topic: ""
    speed_type: auto
    description_topic: /lidar/description
    stats_period_s: 5.0
    qos_reliability: reliable
    qos_depth: 5
