tunnel_od_detector:
  ros__parameters:
    topic: ""
    refit_mode: sync
    refit_every: 1
    qos_reliability: reliable
    qos_depth: 5
    max_pending: 2
    parse_backend: auto
    publish_markers: true
    marker_max_objects: 30
    markers_every: 1
    log_alarms: true
    skip_repeated: true
    stats_period_s: 5.0
    result_file: ""
    stats_file: ""
    detector_json: ""

    detector:
      method: zone
      near_cutoff: 2.0
      max_range: 250.0
      half_width: 1.0
      clearance: 0.15
      height: 2.5
      far_axis: true
      path_margin: 0.0
      far_from: 20.0
      far_half_width: 0.7
      far_top: 1.5
      edge_lines: true
      tracker: evidence
      evidence_threshold: 2.2
      evidence_decay: 0.8
      alarm_hold: 3
      alarm_hold_min: 5
      path_hold: 0
      ego_check: true
      ego_min_travel: 4.0
      ego_max_slope: -0.35
      confirm_hits: 3
      confirm_window: 5
      plausibility: true
      plausible_min_dist: 60.0
      plausible_behind_n: 2
      max_path_age: 30
      default_rail_offset: 0.5
      min_points_k: 12000.0
      min_points_floor: 3

tunnel_od_preproc:
  ros__parameters:
    input_topic: ""
    input_format: auto
    input_axes: auto
    dedupe_dual_return: true
    crop_enabled: true
    crop_fwd_min: 2.0
    crop_fwd_max: 250.0
    apply_mount_tf: false
    base_frame: base_link
    speed_topic: ""
    speed_type: auto
    description_topic: /lidar/description
    stats_period_s: 5.0
    qos_reliability: reliable
    qos_depth: 5
