# Параметры узлов tunnel_od_preproc (C++, приём облака) и tunnel_od_detector (Python).
# Всё под `detector:` передаётся в ObstacleDetector(**kwargs) как есть -- новые
# аргументы ядра можно добавлять сюда без правки узла. Ключи, которых нет у текущей
# версии ObstacleDetector, узел пропускает с предупреждением в логе.
# Не заданные здесь аргументы берутся по умолчанию из ядра (core/tunnel_od).
tunnel_od_detector:
  ros__parameters:
    topic: ""                # "" -- первый найденный топик типа sensor_msgs/msg/PointCloud2
    # Пересчёт оси пути (~80 мс -- больше, чем всё остальное на кадре):
    #   async -- в отдельном процессе по самому свежему кадру, кадр не ждёт пересчёта;
    #   sync  -- в том же вызове detect() раз в refit_every кадров (как в ядре).
    refit_mode: async
    refit_every: 1           # только для sync
    qos_reliability: reliable   # reliable | best_effort (ros2 bag play публикует RELIABLE)
    qos_depth: 5
    max_pending: 2           # очередь кадров к детектору; полна -- отбрасывается самый старый
    parse_backend: auto      # без C++-узла: auto (нативная библиотека, иначе Python) | native | python
    publish_markers: true
    marker_max_objects: 30
    markers_every: 1         # маркеры раз в N кадров (строятся после публикации результата)
    log_alarms: true         # строка в лог на каждый кадр с тревогой
    skip_repeated: true      # побитовый повтор облака -> прошлый результат с repeated: true, детектор не вызывается
    stats_period_s: 5.0      # период сводки (кадр/с, задержка p50/p95, пропуски)
    result_file: ""          # путь для JSONL с результатом каждого кадра ("" -- не писать)
    stats_file: ""           # путь для итоговой статистики JSON при остановке узла
    # JSON-объект, перекрывает detector.* ; для того, что не выразить ROS-параметром
    # (null, вложенные списки), например: '{"zone": [[0.15, 0.35, 1.2], [0.35, 3.7, 1.35]]}'
    detector_json: ""

    detector:
      method: zone           # zone | background
      near_cutoff: 2.0       # м, диапазон дальностей проверки
      max_range: 250.0
      half_width: 1.0        # м, прямоугольная зона: полуширина от оси,
      clearance: 0.15        #    низ и верх над головкой рельса
      height: 2.5            #    подобрано по записи cloud_with_fake_obj
      # zone: GAUGE_METRO    # своя зона: имя константы ядра или плоский список троек
      #                      # [низ, верх, полуширина, низ, верх, полуширина, ...]
      far_axis: true         # продление оси по стенам дальше пошагового (до 150-200 м)
      path_margin: 0.0       # м, тревога только до конца известной оси + столько
      far_from: 20.0         # м за концом найденных рельсов начинается "дальняя" зона:
      far_half_width: 0.7    #    там объект у края (|смещение| > 0.7 м)
      far_top: 1.5           #    или целиком выше 1.5 м над рельсом не поднимает тревогу
      edge_lines: true       # продольные конструкции (кабель, контактный рельс, стена) -- не объект
      tracker: evidence      # evidence -- накопление с учётом движения | hits -- confirm_hits из confirm_window
      evidence_threshold: 2.2
      evidence_decay: 0.8
      alarm_hold: 3          # кадров держать тревогу, если объект с тревогой пропал (только evidence)
      alarm_hold_min: 5      #    держится только тревога, которая уже шла столько кадров
      path_hold: 0           # кадров держать хвост прежней оси, если новая короче (0 -- выкл.:
                             #    на doubleT_platform тревог 68 -> 105 кадров)
      ego_check: true        # ЭГО-тест: подтверждённый объект, держащий дистанцию при движении поезда
      ego_min_travel: 4.0    #    (наклон дистанции по пробегу > ego_max_slope), -- ВНИМАНИЕ, не СТОП.
      ego_max_slope: -0.35   #    Включён по итогам записи cloud_with_fake_obj
      confirm_hits: 3        # для evidence -- минимум кадров с объектом до тревоги
      confirm_window: 5      # только для hits
      plausibility: true     # подтверждённый объект в дальней зоне, за которым НА ЕГО ВЫСОТЕ
      plausible_min_dist: 60.0  #   идут точки (behind_n >= plausible_behind_n), -- поверхность,
      plausible_behind_n: 2     #   задевшая коридор (пол на подъёме/стена), а не предмет: ВНИМАНИЕ, не СТОП
      max_path_age: 30       # кадров держать ось без пересчёта
      default_rail_offset: 0.5
      min_points_k: 12000.0  # ожидаемый минимум точек max(floor, k / d^2)
      min_points_floor: 3

# C++-узел приёма облака (use_cpp_preproc:=true в detector.launch.py). Формат входа --
# docs/INPUT_FORMAT.md. На детекцию влияют только формат, оси, дубли и обрезка; проверка
# потока (/tunnel_od/input_diagnostics) -- только сообщает.
tunnel_od_preproc:
  ros__parameters:
    input_topic: ""          # "" -- первый найденный топик sensor_msgs/msg/PointCloud2
    input_format: auto       # auto | legacy_hesai | contract_v1 | generic
    input_axes: auto         # auto (legacy для legacy_hesai/generic, rep103 для contract_v1) | legacy | rep103
    dedupe_dual_return: true
    # Обрезка по дальности вперёд -- только то, что ядро отбрасывает само: при near_cutoff >= 2
    # и max_range <= 250 ядро не берёт точки ближе 2 м и дальше 250 м (rails.NEAR, bed/path far).
    # launch проверяет это по параметрам detector.* и выключает обрезку, если она небезопасна.
    crop_enabled: true
    crop_fwd_min: 2.0
    crop_fwd_max: 250.0
    apply_mount_tf: false    # поворот облака по /tf_static base_link -> лидар; меняет вход ядра --
                             # включать только после прогона tools/alarms.py и eval_approach.py
    base_frame: base_link
    speed_topic: ""          # S1: TwistStamped / Odometry -> train_speed_mps в результате (в детекции не используется)
    speed_type: auto         # auto | twist | odometry
    description_topic: /lidar/description   # M6: описание датчика (латченый std_msgs/String)
    stats_period_s: 5.0
    qos_reliability: reliable
    qos_depth: 5
