# Эталон бэга организаторов cloud_with_fake_obj (задача 8, 27.09). Формат -- tools/eval_fake_obj.py.
#
# Как найдены объекты: синтетические точки генератор дописывает В КОНЕЦ буфера PointCloud2,
# после последней нулевой точки (0,0,0) реального облака, все с intensity = 1.0; перекрытые
# объектом реальные точки из облака удалены (отсюда число точек != 307200). Хвост после
# последней нулевой точки -- ровно синтетика (проверено на всех 1510 кадрах: intensity хвоста
# всегда 1.0; после кадра 803 хвоста нет). Синтетика разбита на кластеры по кадрам и сведена по
# X = travel_m (runs/alarms_fo_base0.csv) + ближняя дистанция кластера: 10 групп, других нет.
# Номера 1-10 -- по порядку X (дословного списка #437/#460 нет, решение контроллера R9);
# проверка порядка -- смещения объектов 4/5/6/7 совпали с разбором TunnelGuard.
#
# Поля:
#   x_m          -- середина диапазона X (5-95 %) по кадрам, где объект на 2-150 м; разброс X
#                   одного объекта по кадрам <= +-1.6 м от x_m, окно эталона +-5 м покрывает всё
#   lateral_m    -- центр объекта по x лидара на 2-10 м (лидар на оси пути, #440); lat_min_m/lat_max_m -- края
#   low_m/top_m  -- низ/верх над головкой рельса на 10-25 м (головка рельса -- оценка детектора)
#   rail_z_m     -- z головки рельса в системе лидара там же (10-25 м)
#   low_far_m, rail_z_far_m -- то же на 50-120 м: генератор держит z объекта постоянным в системе
#                   лидара, путь впереди идёт под уклон/подъём, поэтому вдали объект парит или тонет
#   frames       -- первый-последний кадр, где есть синтетические точки объекта (вкл. одиночные
#                   дальние точки); first_150m -- первый кадр, где >= 2 точек ближе 150 м
#   draft_group  -- номер группы черновика eval_fake_obj.py draft --tag fo_base0, куда попали
#                   объекты детектора в окне +-5 м (None -- детектор в окне ничего не выдал)
# desc -- что видно в облаке (размеры по синтетическим точкам); expect -- по спеке 5.2.
objects:
  - id: 1
    desc: 'куб 2x2 м по оси пути (x -1.0...+1.0, высота 2.0 м, z лидара -1.48...+0.50); вблизи низ на 0.3 м ниже головки рельса, на 80-120 м парит на 1.3-1.5 м над рельсами (путь впереди под уклон) -- «куб 2x2 м на 98 м, парит 1.4 м» из разбора TunnelGuard; по #437 не перепроверено'
    expect: stop
    x_m: 99.3
    lateral_m: 0.0
    lat_min_m: -1.0
    lat_max_m: 1.0
    low_m: -0.28
    top_m: 1.67
